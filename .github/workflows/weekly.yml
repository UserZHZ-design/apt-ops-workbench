name: 每周热榜+BGM自动刷新

on:
  schedule:
    # 周一 01:00 UTC = 北京时间 09:00（GitHub Actions 使用 UTC）
    - cron: '0 1 * * 1'
  # 允许手动触发测试
  workflow_dispatch: {}

# 允许 Action 推送回仓库
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取热榜+BGM 并生成数据
        run: python .github/scripts/build_data.py

      - name: 提交并推送 data/latest.json
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 每周热榜+BGM数据刷新 $(date +%F)"
            git push https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git HEAD:${{ github.ref_name }}
            echo "已推送更新"
          fi
